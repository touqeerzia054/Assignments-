<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .right{height: 100px; width: 100px;position: absolute; background-color: aqua; position: absolute; right: 0%; 
            animation-name: right; animation-duration: 3s; animation-fill-mode: both;}
        @keyframes right {from{right: 0px;} to{right: calc(50% - 50px); background-color: rgb(69, 197, 46);}}
        .left{height: 100px; width: 100px; margin:0px, absolute; background-color: aqua; position: absolute; left: 0%; 
            animation-name: left; animation-duration: 4s; animation-fill-mode: both;}
        @keyframes left {from{left:0px} to{left: calc(50% - 50px); background-color: rgb(69, 201, 46)}}
    </style>
</head>
<body>
    <div class="right"></div>
    <div class="left"></div>
</body>
</html>
